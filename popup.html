<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Answer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    #answer {
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h3>AI Response</h3>
  <div id="answer">Loading...</div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      chrome.runtime.sendMessage({ action: "getAnswer" }, (response) => {
        const text = response?.answer || "Failed to load response.";
        document.getElementById("answer").textContent = text;
      });
    });
  </script>
</body>
</html>
