<!DOCTYPE html>
<html>
<head>
  <title>AI Answer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #answer {
      white-space: pre-wrap;
      max-width: 400px;
      max-height: 300px;
      overflow-y: auto;
    }
    h2 {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div>
    <h2>AI Response</h2>
    <div id="answer">Loading...</div>
  </div>
  <script>
    // Send a request to get the AI response when the popup is opened
    chrome.runtime.sendMessage({ action: "getAnswer" }, (response) => {
      // Update the popup content with the AI response
      document.getElementById("answer").textContent = response;
    });
  </script>
</body>
</html>
