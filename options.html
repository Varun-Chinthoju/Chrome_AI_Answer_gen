<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AI Extension Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { width: 100%; padding: 8px; margin-top: 10px; }
    button { margin-top: 10px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Set OpenAI API Key</h2>
  <input type="password" id="apiKeyInput" placeholder="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" />
  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <script>
    document.getElementById("saveBtn").addEventListener("click", () => {
      const key = document.getElementById("apiKeyInput").value;
      chrome.storage.local.set({ openai_api_key: key }, () => {
        document.getElementById("status").textContent = "API key saved!";
        setTimeout(() => document.getElementById("status").textContent = "", 2000);
      });
    });

    // Autofill if key already stored
    chrome.storage.local.get("openai_api_key", (data) => {
      if (data.openai_api_key) {
        document.getElementById("apiKeyInput").value = data.openai_api_key;
      }
    });
  </script>
</body>
</html>
